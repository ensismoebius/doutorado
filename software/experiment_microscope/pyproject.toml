[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-microscope"
version = "0.1.0"
description = "Research-grade interactive inspection GUI for the meeting01 and thesis pipelines — a microscope for the research pipeline, not a dashboard"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "PySide6>=6.5",
    "pyqtgraph>=0.13",
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
    "vtk>=9.3",
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
experiment-microscope = "experiment_microscope.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end scientific-parity checks (opt-in, ~30s)"]
addopts = "-m 'not slow'"
