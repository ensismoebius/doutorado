[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "efficient-nn-lab"
version = "0.1.0"
description = "Laboratorio visual desktop para ilustrar BitNet e Spiking Neural Networks em palestra universitaria"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "PySide6>=6.5",
    "matplotlib>=3.7",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
torch-reference = ["torch>=2.0"]

[project.scripts]
efficient-nn-lab = "efficient_nn_lab.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
