# Configuration for Speaker Identification Pipeline: EEG + Audio with Spiking Neural Networks
# PHASE 0 — Frozen Parameters (single source of truth)

window:
  duration_sec: 1.5 # Fixed window duration
  overlap_percent: 50 # 50% overlap (frozen)

normalization:
  range: [0, 1] # Mandatory [0,1] scaling
  method: "min-max"
  paraconsistent_prerequisite: true

classifier:
  type: "ResNet-SNN" # Frozen classifier type
  implementation: "SimpleResNet"
  hidden_dim: 128
  depth: 3
  learning_rate: 0.001

dataset:
  base_path: "/home/ensismoebius/Documentos/UNESP/doutorado/databases/BaseDeDatosHablaImaginada/"
  modalities: ["voice", "eeg", "voice+eeg"]
  features: ["wavelet"]
  sampling_rate: 44100 # Audio sampling rate
  eeg_sampling_rate: 1000 # EEG sampling rate

paraconsistent:
  enabled: true
  metrics: ["alpha", "beta", "G1", "G2"]
  optimal_point: [1.0, 0.0]

experiment:
  seed: 42
  cross_validation: true
  folds: 5
  batch_size: 16
  max_epochs: 5

output:
  results_dir: "results/phase0"
  metrics_file: "metrics_phase0.csv"
  torch_state_file: "phase0_resnet_state.yaml"
