name: C++ CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software/nn

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        # Build dependencies (eigen, openblas, sdl2, fftw, hdf5, glfw, omp,
        # OpenCL headers/loader, sqlite, zlib, cmake, ninja, autotools, python3)
        # are installed by cmake/UbuntuDependencies.cmake at Configure time.
        # Only CI-specific tooling is installed here.
        sudo apt-get install -y clang clang-tidy clang-tools cppcheck ccache pocl-opencl-icd python3-dev python3-venv python3-numpy
        if [ ! -e /usr/lib/libgomp.so ] && [ -e /usr/lib/x86_64-linux-gnu/libgomp.so.1 ]; then
          sudo ln -s /usr/lib/x86_64-linux-gnu/libgomp.so.1 /usr/lib/libgomp.so
        fi

    - name: Configure
      run: cmake --preset=max-performance

    - name: Build
      run: cmake --build --preset=max-performance -j$(nproc)

    - name: Run cppcheck
      run: cmake --build --preset=max-performance --target analysis-cppcheck -j$(nproc)

    - name: Run clang-tidy
      run: run-clang-tidy -p out/build/max-performance

    - name: Run tests
      run: ctest --test-dir out/build/max-performance --output-on-failure -j4

    - name: Run pipeline script tests
      run: python3 scripts/testing/test_thesis_phase_scripts.py
