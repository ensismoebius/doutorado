name: C++ CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software/nn

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build clang clang-tidy clang-tools cppcheck ccache libeigen3-dev libblas-dev liblapack-dev libopenblas-dev libsdl2-dev libomp-dev libgomp1 ocl-icd-opencl-dev opencl-headers libfftw3-dev libnfft3-dev pkg-config libhdf5-dev libglfw3-dev libsqlite3-dev python3 python3-dev python3-venv python3-numpy
        if [ ! -e /usr/lib/libgomp.so ] && [ -e /usr/lib/x86_64-linux-gnu/libgomp.so.1 ]; then
          sudo ln -s /usr/lib/x86_64-linux-gnu/libgomp.so.1 /usr/lib/libgomp.so
        fi

    - name: Configure
      run: cmake --preset=max-performance

    - name: Build
      run: cmake --build --preset=max-performance -j$(nproc)

    - name: Run cppcheck
      run: cmake --build --preset=max-performance --target analysis-cppcheck -j$(nproc)

    - name: Run clang-tidy
      run: run-clang-tidy -p out/build/max-performance

    - name: Run tests
      run: ctest --test-dir out/build/max-performance --output-on-failure -j4

    - name: Run pipeline script tests
      run: python3 scripts/pipeline/test_e05_phase_scripts.py
