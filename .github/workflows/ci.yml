name: C++ CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software/nn

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        # Build dependencies (eigen, openblas, fftw, hdf5, glfw, omp,
        # sqlite, zlib, cmake, ninja, autotools, python3)
        # are installed by cmake/UbuntuDependencies.cmake at Configure time.
        # Only CI-specific tooling is installed here.
        sudo apt-get install -y clang clang-tidy clang-tools cppcheck ccache python3-dev python3-venv python3-numpy python3-scipy python3-pytest python3-fastapi
        if [ ! -e /usr/lib/libgomp.so ] && [ -e /usr/lib/x86_64-linux-gnu/libgomp.so.1 ]; then
          sudo ln -s /usr/lib/x86_64-linux-gnu/libgomp.so.1 /usr/lib/libgomp.so
        fi

    - name: Configure
      run: cmake --preset=max-performance

    - name: Build
      run: cmake --build --preset=max-performance -j$(nproc)

    - name: Run cppcheck
      run: cmake --build --preset=max-performance --target analysis-cppcheck -j$(nproc)

    - name: Show the cppcheck findings
      if: failure()
      # the target writes its findings to XML only; without this a failure shows no finding
      run: grep -E '<(error|location) ' out/build/max-performance/cppcheck-report.xml

    - name: Run clang-tidy
      # project sources only: the compile database also lists the vendored _deps sources
      run: run-clang-tidy -quiet -p out/build/max-performance 'software/nn/src/'

    - name: Run tests
      run: ctest --test-dir out/build/max-performance --output-on-failure -j4

    - name: Run pipeline script tests
      run: python3 scripts/testing/test_thesis_phase_scripts.py

    - name: Run BIOMEX-DB converter tests
      run: python3 scripts/testing/test_biomex_convert.py

    - name: Run base check tests (Coretto mirror, base facts)
      run: python3 scripts/testing/test_thesis_base_checks.py

    - name: Run Meeting01 monitoring tool tests (pytest)
      run: >-
        python3 -m pytest -q
        scripts/testing/test_downsample.py scripts/testing/test_ga_cache.py
        scripts/testing/test_sweep_state.py scripts/testing/test_meeting01_dashboard_data.py
        scripts/testing/test_remote_ga_collect.py
