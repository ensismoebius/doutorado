name: C++ CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build clang clang-tidy cppcheck libeigen3-dev libblas-dev liblapack-dev libopenblas-dev libsdl2-dev libomp-dev pkg-config libhdf5-dev libglfw3-dev

    - name: Configure
      run: |
        cd software/nn
        mkdir build
        cd build
        cmake .. -G Ninja

    - name: Build
      run: |
        cd software/nn/build
        ninja

    - name: Run clang-tidy
      run: |
        cd software/nn
        run-clang-tidy

    - name: Run cppcheck
      run: |
        cd software/nn
        cppcheck --project=build/compile_commands.json --output-file=cppcheck.xml --enable=all --suppress=missingIncludeSystem

    - name: Run tests
      run: |
        cd software/nn/build
        ctest

    - name: Run pipeline script tests
      run: |
        python3 software/nn/scripts/pipeline/test_e05_phase_scripts.py
