name: C++ CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build clang clang-tidy cppcheck

    - name: Configure
      run: |
        mkdir build
        cd build
        cmake .. -G Ninja

    - name: Build
      run: |
        cd build
        ninja

    - name: Run clang-tidy
      run: |
        run-clang-tidy

    - name: Run cppcheck
      run: |
        cppcheck --project=build/compile_commands.json --output-file=cppcheck.xml --enable=all --suppress=missingIncludeSystem

    - name: Run tests
      run: |
        cd build
        ctest
